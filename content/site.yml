    cover: ""
    content: |
      今日收藏：
      ☁️ 云朵像一团刚打好的奶油。
      🐈 路边猫猫的尾巴尖。
      🎵 随机播放时刚好出现的那首歌。
      🌼 花店门口开得很认真的小花。

