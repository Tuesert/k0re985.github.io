posts:
  - title: 把普通的一天过成草莓味
    date: "2026-10-18"
    category: 日常
    emoji: 🍓
    cover: ""
    content: |
      今天没有发生什么惊天动地的大事。
      晒到了太阳，喝到了喜欢的饮料，路上还看到一只很有礼貌的小猫。

      突然觉得，生活不一定要时时刻刻都很厉害。能发现一点点可爱，就已经很值得庆祝啦。🍓
  - title: 脑袋里住着一颗小星球
    date: "2026-10-16"
    category: 灵感
    emoji: 🪐
    cover: ""
    content: |
      最近脑子里有好多奇奇怪怪的想法，像一群不肯排队的小兔子。

      先把它们写下来吧。以后回头看，可能会觉得好笑，也可能真的能做成什么有趣的东西。灵感不需要穿西装，它穿睡衣来也可以。
  - title: 给未来的自己一封信
    date: "2026-10-12"
    category: 收藏
    emoji: 💌
    cover: ""
    content: |
      嗨，未来的我：

      希望你还保留着一点好奇心，也依然会为了小事开心。希望你没有因为长大，就把喜欢的东西都弄丢了。

      如果你最近很累，先去吃点好吃的、睡个好觉。人生不是一场必须连续通关的游戏。
  - title: 想去有风的地方
    date: "2026-10-09"
    category: 旅行
    emoji: 🧳
    cover: ""
    content: |
      想找一个天气晴朗的周末，背上小包，去一个没去过的地方。走走停停，拍几张模糊但很喜欢的照片，晚上再认真吃一顿饭。

      旅行计划暂时还没定，但期待本身也很好玩。
  - title: 今天的可爱收藏夹
    date: "2026-10-05"
    category: 收藏
