<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff4f6">
<title>Jiangnan Northeast Surprise｜江南东北惊喜盲盒</title>
<style>
:root{--ink:#443b54;--pink:#ffd9e6;--yellow:#ffe99b;--blue:#ccecff;--mint:#d9f5df;--purple:#e8dcff;--paper:#fffdf8;--line:#eadff0}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Nunito","PingFang SC","Microsoft YaHei",sans-serif;background:#fffaf2;background-image:radial-gradient(#f4dce7 1.5px,transparent 1.5px);background-size:22px 22px}
.shell{max-width:1100px;margin:auto;padding:24px 20px 60px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px;font-size:1.25rem;font-weight:1000}.logo{width:48px;height:48px;border-radius:17px;background:var(--yellow);display:grid;place-items:center;font-size:27px;transform:rotate(-7deg);box-shadow:4px 4px 0 #ead8a1}.btn{display:inline-block;padding:11px 16px;border-radius:15px;background:white;box-shadow:0 3px 0 #e8dce8;text-decoration:none;color:var(--ink);font-weight:800}.btn.primary{background:var(--pink);box-shadow:0 3px 0 #e8b7ca}
.hero{margin:30px 0 24px;padding:30px;border:2px solid white;border-radius:30px;background:linear-gradient(120deg,#ffe2eb,#fff0bd 58%,#ddf4ff);box-shadow:0 7px 0 #eadfe8;position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;right:7%;top:12%;font-size:60px;color:#fff9;transform:rotate(14deg)}.hero h1{font-size:clamp(2rem,5vw,3.4rem);margin:0 0 12px;letter-spacing:-1px}.hero p{font-size:1.05rem;line-height:1.8;max-width:650px;margin:0}.sticker{display:inline-block;margin-top:18px;background:white;padding:8px 14px;border-radius:999px;transform:rotate(-2deg);font-weight:900}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{padding:9px 14px;border-radius:999px;background:white;border:2px solid transparent;color:var(--ink);font-weight:800;cursor:pointer}.filter.active{background:var(--purple);border-color:white}.search{padding:12px 15px;border:2px solid white;border-radius:14px;outline:none;background:#fff;min-width:210px;box-shadow:0 3px 0 #eee1ec}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.post{background:var(--paper);border:2px solid white;border-radius:23px;padding:16px;box-shadow:0 5px 0 #eadfe8;display:flex;flex-direction:column;min-height:270px;transition:transform .2s}.post:hover{transform:translateY(-4px) rotate(-.3deg)}.post-art{height:115px;border-radius:17px;display:grid;place-items:center;font-size:48px;margin-bottom:14px;overflow:hidden}.post-art img{width:100%;height:100%;object-fit:cover}.meta{font-size:.8rem;opacity:.7;display:flex;justify-content:space-between;gap:8px}.post h2{font-size:1.2rem;line-height:1.4;margin:10px 0 7px}.post p{line-height:1.7;margin:0 0 14px;opacity:.85;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}.post-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px}.tag{background:#f3eaff;border-radius:9px;padding:6px 9px;font-size:.78rem;font-weight:800}.mini{padding:7px 10px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:800;cursor:pointer}.empty{grid-column:1/-1;text-align:center;padding:50px 20px;background:#fff;border-radius:24px;border:2px dashed #e8d9e9}footer{text-align:center;margin-top:36px;opacity:.7;font-size:.9rem}.modal-backdrop{position:fixed;inset:0;background:#33294366;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-backdrop.show{display:flex}.modal{width:min(700px,100%);max-height:90vh;overflow:auto;background:#fffdf8;border:3px solid white;border-radius:26px;padding:23px;box-shadow:0 10px 0 #d6c6db}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.modal-head h2{margin:0}.close{width:36px;height:36px;border-radius:12px;background:var(--pink);font-size:20px;border:0;cursor:pointer}.reader-content{white-space:pre-wrap;line-height:1.9;font-size:1.03rem}.reader-art{height:160px;border-radius:18px;display:grid;place-items:center;font-size:60px;margin:12px 0;overflow:hidden}.reader-art img{width:100%;height:100%;object-fit:cover}.notice{background:#fff;border:1px solid #f0e4ef;padding:12px 14px;border-radius:14px;line-height:1.6}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){.shell{padding:16px 13px 40px}.grid{grid-template-columns:1fr}.hero{padding:23px}.search{width:100%}.toolbar{align-items:stretch}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><div class="logo">🌷</div><span id="siteName">Jiangnan Northeast Surprise｜江南东北惊喜盲盒</span></div>
<section class="hero"><h1 id="heroTitle">欢迎来到江南东北惊喜盲盒☁️</h1><p id="heroDesc">收录河北、灵石、东北、台州、嵊州等地的奇人异事，专注研究校园神人、爱情连续剧、贫穷文学与人类生活技能的极限。</p><span class="sticker" id="heroSticker">🌈 今日份奇葩已加载</span></section>
<section class="toolbar"><div class="filters" id="filters"><button class="filter active" data-filter="全部">✨ 全部</button><button class="filter" data-filter="日常">🍓 日常</button><button class="filter" data-filter="灵感">💡 灵感</button><button class="filter" data-filter="旅行">🧳 旅行</button><button class="filter" data-filter="收藏">🎀 收藏</button></div><input class="search" id="searchInput" placeholder="🔎 搜索标题或内容……" aria-label="搜索文章"></section>
<main class="grid" id="postGrid"><div class="empty">🪄 正在打开江南东北惊喜盲盒</div></main>
</div>
<div class="modal-backdrop" id="readerModal"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="readerTitle"><div class="modal-head"><h2 id="readerTitle"></h2><button class="close" id="closeReader" aria-label="关闭">×</button></div><div class="meta"><span id="readerDate"></span><span id="readerCategory"></span></div><div class="reader-art" id="readerArt"></div><div class="reader-content" id="readerContent"></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script>
const colors={日常:"#ffe0e9",灵感:"#e8ddff",旅行:"#d7efff",收藏:"#fff0b8"};
let posts=[], activeFilter="全部";
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function setSite(s){$("siteName").textContent=s.site_name||"江南东北惊喜盲盒";document.title=s.site_name||"江南东北惊喜盲盒";$("heroTitle").textContent=s.hero_title||"欢迎来到江南东北惊喜盲盒！☁️";$("heroDesc").textContent=s.hero_desc||"";$("heroSticker").textContent=s.hero_sticker||"🌈 今日份奇葩已加载";posts=Array.isArray(s.posts)?s.posts:[];renderPosts();}
function renderPosts(){const q=$("searchInput").value.trim().toLowerCase();const visible=posts.filter(p=>(activeFilter==="全部"||p.category===activeFilter)&&(`${p.title||""} ${p.content||""} ${p.category||""}`).toLowerCase().includes(q));$("postGrid").innerHTML=visible.length?visible.map((p,i)=>{const image=p.cover?`<img src="${esc(p.cover)}" alt="">`:`<span>${esc(p.emoji||"🌷")}</span>`;return `<article class="post"><div class="post-art" style="background:${colors[p.category]||"#f0e5ff"}">${image}</div><div class="meta"><span>${esc(p.date||"")}</span><span>一颗小星星 ✦</span></div><h2>${esc(p.title||"无标题")}</h2><p>${esc(p.content||"")}</p><div class="post-bottom"><span class="tag">${esc(p.category||"日常")}</span><button class="mini" data-read="${i}">阅读 ↗</button></div></article>`}).join(""):`<div class="empty"><div style="font-size:42px">🧺</div><h2>这里暂时空空的</h2><p>去管理后台写下第一篇小故事吧。</p><a class="btn primary" href="/admin/">＋ 写一篇</a></div>`;}
$("filters").addEventListener("click",e=>{const b=e.target.closest("[data-filter]");if(!b)return;activeFilter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));renderPosts();});
$("searchInput").addEventListener("input",renderPosts);
$("postGrid").addEventListener("click",e=>{const b=e.target.closest("[data-read]");if(!b)return;const visible=posts.filter(p=>(activeFilter==="全部"||p.category===activeFilter)&&(`${p.title||""} ${p.content||""} ${p.category||""}`).toLowerCase().includes($("searchInput").value.trim().toLowerCase()));const p=visible[Number(b.dataset.read)];if(!p)return;$("readerTitle").textContent=p.title||"无标题";$("readerDate").textContent=p.date||"";$("readerCategory").textContent=p.category||"日常";$("readerArt").innerHTML=p.cover?`<img src="${esc(p.cover)}" alt="">`:`<span>${esc(p.emoji||"🌷")}</span>`;$("readerArt").style.background=colors[p.category]||"#f0e5ff";$("readerContent").textContent=p.content||"";$("readerModal").classList.add("show");});
$("closeReader").addEventListener("click",()=>$("readerModal").classList.remove("show"));$("readerModal").addEventListener("click",e=>{if(e.target.id==="readerModal")e.currentTarget.classList.remove("show")});document.addEventListener("keydown",e=>{if(e.key==="Escape")$("readerModal").classList.remove("show")});
async function init(){try{const r=await fetch("./content/site.yml?cache="+Date.now());if(!r.ok)throw Error("HTTP "+r.status);const text=await r.text();setSite(window.jsyaml.load(text)||{});}catch(e){$("postGrid").innerHTML=`<div class="empty"><div style="font-size:42px">🪴</div><h2>星球日记暂时没有加载成功</h2><p>请确认仓库中存在 <code>content/site.yml</code>，并且网站已完成 GitHub Pages 部署。</p><p style="font-size:.8rem;opacity:.7">${esc(e.message)}</p><a class="btn" href="/admin/">打开管理后台</a></div>`;}}
init();
</script>
</body>
</html>
